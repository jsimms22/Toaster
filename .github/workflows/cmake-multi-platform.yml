name: CMake Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [cl, gcc]
        cxx_compiler: [cl, g++]
        include:
          - os: ubuntu-latest
            triplet: x64-linux
            configure: release
            build: release-build

          - os: windows-latest
            triplet: x64-windows
            configure: release
            build: release-build
        exclude:
          - os: ubuntu-latest
            c_compiler: cl
            cxx_compiler: cl

          - os: windows-latest
            c_compiler: gcc
            cxx_compiler: g++

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Show VCPKG_ROOT
        shell: bash
        run: |
          echo "VCPKG_ROOT=$VCPKG_ROOT"

      - name: Configure
        run: cmake --preset ${{ matrix.configure }}

      - name: Build
        run: cmake --build --preset ${{ matrix.build }}
