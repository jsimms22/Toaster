# docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
name: toasterbot-dev

services:
  nginx-proxy-manager:
      image: 'jc21/nginx-proxy-manager:latest'
      container_name: nginx-proxy-manager-dev
      restart: unless-stopped
      ports:
        - '80:80'
        - '443:443'
        - '81:81'
        - '27017:27017'
      volumes:
        - nginx-dev-data:/data:/data
        - nginx-dev-data:/letsencrypt:/etc/letsencrypt
      networks:
        - web-network

  mongodb:
    image: mongo:8
    container_name: mongodb-dev
    restart: unless-stopped
    depends_on:
      - nginx-proxy-manager
    #ports:
      #- "27017:27017"
    volumes:
      - mongo-dev-data:/data/db
    networks:
      - web-network
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/db_user
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/db_pass
    secrets:
      - db_user
      - db_pass

    # Health check for MongoDB
    healthcheck:
      test: 
        [
          "CMD-SHELL",
          "mongosh -u $$(cat /run/secrets/db_user) -p $$(cat /run/secrets/db_pass) --authenticationDatabase admin --quiet --eval 'db.adminCommand(\"ping\")'"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
      
  toaster:
    build:
      context: .
      dockerfile: Dockerfile
    image: toaster-dev:latest
    container_name: toaster-dev
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - web-network
    environment:
      MONGO_USE_SRV: "false"

volumes:
  mongo-dev-data:
  nginx-dev-data:

networks:
  web-network:
    driver: bridge